<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Home Page</h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <table class="table">
        <thead>
            <tr><th>ID</th><th>Course Number</th><th>Description</th><th>Last Semester Taught</th><th>Max Students</th></tr>
        </thead>
        <tbody id="order-body"></tbody>
    </table>

    <form id="add-class" class="mt-4">
    <div class="mb-3">
    <label for="courseNo" class="form-label">Course Number</label>
    <input type="text" id="courseNo" class="form-control">
  </div>
    <div class="mb-3">
    <label for="courseDesc" class="form-label">Description</label>
    <input type="text" id="courseDesc" class="form-control">
  </div>
  <div class="mb-3">
    <label for="lastSemTaught" class="form-label">Last Semester Taught</label>
    <input type="text" id="lastSemTaught" class="form-control">
  </div>
  <div class="mb-3">
    <label for="maxStudents" class="form-label">Max Students</label>
    <input type="number" id="maxStudents" class="form-control">
  </div>
  <button type="submit" class="btn btn-primary">Add Order</button>
</form>

<script src = "app.js"></script>

</body>

</html>
